# 网关配置
# 修改后需重启 gateway.py

[upstream]
# chatgpt2api 地址（本机）
base_url = http://localhost:3001
# chatgpt2api 的 auth-key
# 留空即可：网关会自动改用环境变量 CHATGPT2API_AUTH_KEY（见 .env）
auth_key = 
# 单次请求超时（秒）
timeout = 300
# 遇到 TLS/502 时的重试次数
retries = 4

[listen]
# 网关监听地址
host = 0.0.0.0
# 网关端口（给客户端用的）
port = 3000

[behavior]
# 清理模型输出里的 <badge>/<box>/<escape> 等网页残留标签
clean_ui_markup = true
# 估算 token 用量（上游不一定返回准确值）
estimate_usage = true
# 默认模型
default_model = auto
