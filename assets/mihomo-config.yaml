# 占位文件：首次部署后请到「代理设定」页粘贴你的订阅链接，
# 系统会自动填充节点。详见 mihomo-config.template.yaml
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114
  nameserver:
    - 223.5.5.5
    - 114.114.114.114
    - 119.29.29.29

proxy-groups:
  - name: ChatGPT
    type: select
    proxies:
      - 节点选择
  - name: 节点选择
    type: select
    proxies:
      - DIRECT

rules:
  - 'DOMAIN-SUFFIX,blob.core.windows.net,DIRECT'
  - 'DOMAIN-SUFFIX,azureedge.net,DIRECT'
  - 'DOMAIN-SUFFIX,azurefd.net,DIRECT'
  - DOMAIN-SUFFIX,openai.com,ChatGPT
  - DOMAIN-SUFFIX,chatgpt.com,ChatGPT
  - MATCH,ChatGPT
